<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAO rescue operations: guided demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF;--wash:#F5F7FA;--ink:#17202E;--ink2:#5A6678;--line:#DDE3EC;--card:#FFFFFF;
  --accent:#1F4E79;--accent-soft:#E8F0F8;--accent-ring:rgba(31,78,121,.35);--btn-bg:#1F4E79;--btn-ink:#FFFFFF;
  --red:#C9382B;--red-bg:#FCE9E7;--red-ink:#8C2A21;--amber:#C98A12;--green:#2F8F5B;--neutral:#EEF1F6;
  --shadow:0 1px 2px rgba(23,32,46,.06),0 6px 18px rgba(23,32,46,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151C;--wash:#171E28;--ink:#EEF2F7;--ink2:#A7B3C4;--line:#2A3442;--card:#171E28;
    --accent:#7FB2E5;--accent-soft:#1D2B3D;--accent-ring:rgba(127,178,229,.45);--btn-bg:#7FB2E5;--btn-ink:#0B1A2B;
    --red-bg:#4A1F1B;--red-ink:#FFB4A9;--neutral:#222B38;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C;--wash:#171E28;--ink:#EEF2F7;--ink2:#A7B3C4;--line:#2A3442;--card:#171E28;
  --accent:#7FB2E5;--accent-soft:#1D2B3D;--accent-ring:rgba(127,178,229,.45);--btn-bg:#7FB2E5;--btn-ink:#0B1A2B;
  --red-bg:#4A1F1B;--red-ink:#FFB4A9;--neutral:#222B38;--shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;line-height:1.45;font-size:15px}
button{font-family:inherit;cursor:pointer;color:inherit}
img{display:block}
.shell{max-width:1120px;margin:0 auto;padding:14px 18px 28px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
h1{font-size:18px;font-weight:600;margin:0;line-height:1.2}
.brand small{display:block;color:var(--ink2);font-size:12.5px;font-weight:500}
.steps{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pst{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px 6px 7px;font-weight:600;font-size:13.5px}
.pst .n{width:22px;height:22px;border-radius:6px;background:var(--neutral);display:grid;place-items:center;font-size:12px}
.pst.cur{border-color:var(--accent);background:var(--accent-soft)}
.pst.cur .n{background:var(--accent);color:var(--btn-ink)}
.pst.done .n{background:var(--green);color:#fff}
.sep{color:var(--ink2)}

.guide{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent-soft);border:1px solid var(--accent);border-left-width:5px;border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.guide .lab{font-size:12px;font-weight:700;color:var(--accent);text-transform:none;white-space:nowrap}
.guide .go{flex:1;min-width:230px}
.guide .go b{font-weight:600;font-size:16px}
.guide .why{font-size:13.5px;color:var(--ink2);margin-top:1px}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line);display:block}
.dots i.on{background:var(--accent)}
.guide .acts{display:flex;gap:10px;align-items:center}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;font-weight:600;font-size:14px;padding:8px 16px}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:13px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0;text-decoration:none}
.linkbtn:hover{text-decoration:underline}
.btn:focus-visible,.pst:focus-visible,.msg:focus-visible,.crd:focus-visible,.linkbtn:focus-visible,.ph:focus-visible{outline:3px solid var(--accent-ring);outline-offset:2px}
.pulse{animation:pulse 1.6s ease-in-out infinite;position:relative;z-index:1;outline:2px solid var(--accent);outline-offset:2px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-ring)}50%{box-shadow:0 0 0 9px rgba(31,78,121,0)}}

h2{font-size:20px;font-weight:600;margin:0 0 2px}
h3{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 8px;letter-spacing:.01em}
.sub{font-size:14px;color:var(--ink2);margin:0 0 14px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.msgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.msg{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.msg b{display:block;font-weight:600;font-size:15px}
.msg small{color:var(--ink2);font-size:13px}
.msg.sel{border-color:var(--accent);background:var(--accent-soft)}
.msg:disabled{opacity:.65;cursor:wait}
.bub{background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14.5px;margin-bottom:14px}
.pipe{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pp{display:flex;align-items:center;gap:7px;border-radius:8px;background:var(--neutral);padding:4px 11px 4px 5px;font-size:13px;font-weight:600;color:var(--ink2)}
.pp i{font-style:normal;width:20px;height:20px;border-radius:5px;background:var(--card);display:grid;place-items:center;font-size:11px}
.pp.on{background:var(--accent);color:var(--btn-ink)}
.pp.on i{color:var(--ink)}
.pp.done{background:var(--accent-soft);color:var(--ink)}
.pp.done i{background:var(--green);color:#fff}
.cap{font-size:13.5px;color:var(--ink2);min-height:20px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card)}
.tile small{display:block;font-size:12px;color:var(--ink2);font-weight:600}
.tile b{display:block;font-weight:600;font-size:16px;line-height:1.25;margin-top:3px}
.tile span{font-size:13px;color:var(--ink2)}
.tile.dec{background:var(--accent-soft);border-color:var(--accent)}
.tile.bad{background:var(--red-bg);border-color:var(--red)}
.tile.bad b,.tile.bad span{color:var(--red-ink)}
.bm{position:relative;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bm span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bm.over span{background:var(--red)}
.bm i{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink)}
.letter{border:1px dashed var(--ink2);border-radius:12px;padding:11px 14px;margin-top:12px;font-size:14px}
.letter .lh{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-weight:600}
.tg{border-radius:6px;font-size:12px;font-weight:600;padding:2px 8px;background:var(--neutral);color:var(--ink);white-space:nowrap}
.tg.red{background:var(--red-bg);color:var(--red-ink)}
.letter ul{margin:4px 0 0;padding-left:18px}
.hello{text-align:center;color:var(--ink2);padding:36px 10px;border:1px dashed var(--line);border-radius:12px}

.case{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);box-shadow:var(--shadow)}
.case.empty{border-style:dashed;box-shadow:none;text-align:center;color:var(--ink2);padding:30px 14px}
.chead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ph{padding:0;border:0;background:none;border-radius:50%;flex:none;position:relative}
.ph img{border-radius:50%;object-fit:cover;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.ph.l img{width:64px;height:64px}.ph.m img{width:44px;height:44px}.ph.s img{width:38px;height:38px}
.ph.fb{width:44px;height:44px;border-radius:50%;background:var(--neutral);display:grid;place-items:center;font-weight:700;color:var(--ink2)}
.nm{font-weight:600;font-size:17px;line-height:1.2}
.nmb{background:none;border:0;padding:0;font-weight:600;font-size:inherit;text-align:left}
.nmb:hover{color:var(--accent);text-decoration:underline}
.by{font-size:13px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:10px 0 12px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row{display:grid;grid-template-columns:128px minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--card);box-shadow:var(--shadow)}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr)}}
.who2{display:flex;gap:11px;align-items:center;min-width:0}
.row .fl{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:7px;background:var(--neutral);font-size:12.5px;font-weight:600;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.red{background:var(--red-bg);color:var(--red-ink)}.pill.red::before{background:var(--red)}
.pill.yellow::before{background:var(--amber)}.pill.green::before{background:var(--green)}
.slot .who{font-weight:600;font-size:14.5px}
.slot .who small{color:var(--ink2);font-weight:500;font-size:12.5px}
.slot .ap{font-size:12.5px;margin-top:2px;color:var(--ink2)}
.slot .ap.chk{color:var(--red-ink);font-weight:600}
.slot .wait{color:var(--ink2);font-size:14px}
.row.pop{animation:pop .5s ease}
@keyframes pop{0%{background:var(--accent-soft)}100%{background:var(--card)}}
.admin{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.admin .t{flex:1;min-width:200px}
.admin b{font-weight:600;font-size:15.5px}
.ok{border:1px solid var(--green);border-radius:12px;padding:12px 14px;margin:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
.ok span{flex:1;min-width:200px}

.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ctl .sel{font-size:13.5px;color:var(--ink2)}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto;padding:4px 2px 12px}
.col{background:var(--wash);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:260px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;font-size:14px}
.ch .n{width:22px;height:22px;border-radius:6px;background:var(--neutral);display:grid;place-items:center;font-size:12px}
.ch .c{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink2)}
.cards{display:flex;flex-direction:column;gap:8px}
.crd{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 11px;box-shadow:var(--shadow);cursor:default}
.crd.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring)}
.crd .top{display:flex;align-items:center;gap:9px}
.crd .top .tx{min-width:0;flex:1}
.crd .nmb{font-size:14.5px}
.crd .dot{width:9px;height:9px;border-radius:50%;flex:none}
.crd .by{font-size:12.5px}
.prg{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);margin-top:9px}
.prg .bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prg .bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.crd .nx{font-size:12.5px;margin-top:6px}
.crd .vf{margin-top:6px}
.sug{margin-top:8px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 10px}
.sug div{font-weight:600;font-size:13px;margin-bottom:6px}
.joy{margin-top:8px;font-weight:600;font-size:13px;background:var(--neutral);border-radius:8px;padding:5px 9px}
.crd.enter{animation:hop .5s ease}
@keyframes hop{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
.fin{text-align:center;padding:10px 0 4px;font-weight:600;font-size:16px}
.credits{margin-top:18px;font-size:12px;color:var(--ink2)}
.credits summary{cursor:pointer;font-weight:600}
.credits ul{margin:6px 0 0;padding-left:18px}
.credits a{color:var(--accent)}

/* case file drawer */
.scrim{position:fixed;inset:0;background:rgba(15,22,32,.45);z-index:40;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:-10px 0 40px rgba(15,22,32,.25);animation:slide .25s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dph{position:relative}
.dph img{width:100%;height:250px;object-fit:cover}
.dph .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(15,22,32,.65);color:#fff;font-size:20px;line-height:1}
.dph .x:focus-visible{outline:3px solid #fff}
.dph .cr{position:absolute;left:12px;bottom:8px;font-size:11px;color:#fff;background:rgba(15,22,32,.55);border-radius:6px;padding:2px 7px}
.dbody{padding:16px 20px 0}
.dtitle{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.dtitle h2{font-size:24px;margin:0}
.dmeta{color:var(--ink2);font-size:14px;margin:2px 0 0}
.dsec{margin-top:18px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.dgrid div small{display:block;font-size:12px;color:var(--ink2);font-weight:600}
.dgrid div span{font-size:14px;font-weight:500}
.handled{border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-top:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.handled b{font-weight:600}
.stepper{display:flex;gap:4px;margin-bottom:8px}
.stepper i{flex:1;height:5px;border-radius:3px;background:var(--line);display:block}
.stepper i.on{background:var(--accent)}
.stepper i.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-ring)}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.cl li{display:flex;gap:8px;align-items:center}
.cl .b{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink2);display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.cl li.d .b{background:var(--green);border-color:var(--green)}
.dl{margin:0;padding-left:18px;font-size:14px}
.dl li{margin-bottom:3px}.dl span{color:var(--ink2)}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;gap:9px}
.hist li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.dfoot{padding:18px 20px 0}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.row.pop,.crd.enter,.drawer,.scrim{animation:none}.prg .bar span{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="brand"><div class="mark">AAO</div><div><h1>Rescue operations</h1><small>Against All Oddz Animal Alliance</small></div></div>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
  </header>
  <div class="guide" id="guide" role="status" aria-live="polite"></div>
  <main id="view"></main>
  <details class="credits" id="credits"></details>
</div>

    }).join("") + '</div><div class="cap">' + esc(run ? cur.caps[Math.min(i, 4)] : "Done in seconds. A person stays in charge of the hard calls.") + '</div>';
    if (!run){
      var over = cur.hi > BUDGET, pct = Math.min(100, Math.round(cur.hi / (BUDGET * 2) * 100));
      left += '<div class="tiles"><div class="tile"><small>Fetch found</small><b>' + esc(cur.found) + '</b><span>' + esc(cur.found2) + '</span></div>' +
        '<div class="tile"><small>Estimated cost</small><b>' + esc(cur.text) + '</b><div class="bm' + (over ? " over" : "") + '"><span style="width:' + pct + '%"></span><i></i></div><span>' + (over ? "Over" : "Within") + ' the ' + money(BUDGET) + ' limit</span></div>' +
        '<div class="tile ' + (over ? "bad" : "dec") + '"><small>Decision</small><b>' + esc(cur.dec) + '</b><span>' + esc(cur.dec2) + '</span></div></div>';
      if (S.shown === "gary"){
        left += '<div class="letter"><div class="lh"><span>Referral reply</span><span class="tg">Drafted, not sent</span></div>Hi Gary, thank you for reaching out. We cannot cover this cost, but these can help quickly:<ul><li>Animal control</li><li>County SPCA and partner rescues</li><li>Low-cost vet clinics</li></ul></div>';
      }
    }
  }
  var right;
  if (!S.caseStarted){
    right = '<div class="case empty">No case yet</div>';
  } else {
    right = '<div class="case"><div class="chead">' + photo("biscuit", "l") + '<div><div class="nm"><button class="nmb" data-act="file" data-id="biscuit">Biscuit</button></div><div class="by">Case started by Fetch</div></div></div>' +
      '<dl class="kv"><dt>Animal</dt><dd>Dog</dd><dt>Situation</dt><dd>Landlord says he must go</dd><dt>Contact</dt><dd>Dana</dd><dt>Cost</dt><dd>' + MSGS.text.text + '</dd></dl>' +
      '<div class="chips"><span class="tg red">Bite history</span><span class="tg">3 action items</span></div>' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      (S.sent ? '<button class="btn primary" data-act="goview" data-v="2">On to triage</button>' : '<button class="btn primary" data-act="send" data-guide="send">Send to triage</button>') +
      '<button class="linkbtn" data-act="file" data-id="biscuit">View file</button></div></div>';
  }
  return '<div class="two"><div>' + left + '</div><div>' + right + '</div></div>';
}

function queue(){ return QUEUE.filter(function(c){ return !c.s1 || S.sent; }); }
function view2(){
  var q = queue(), waiting = q.filter(function(c){ return !S.asg[c.id]; });
  var pend = q.filter(function(c){ return S.asg[c.id] && c.check && !S.approved[c.id]; });
  var rows = q.map(function(c){
    var a = S.asg[c.id], slot, f = FILES[c.id];
    if (a){
      slot = '<div class="who">' + esc(c.who) + ' <small>' + esc(c.role) + '</small></div><div class="ap' + (c.check && !S.approved[c.id] ? " chk" : "") + '">' +
        (c.check && !S.approved[c.id] ? "Needs an admin look" : "Approved") + ' (' + esc(c.why) + ')</div>';
    } else slot = '<div class="wait">Waiting</div>';
    return '<div class="row' + (S.pop === c.id ? " pop" : "") + '"><span class="pill ' + c.pri + '">' + PRI[c.pri] + '</span><div class="who2">' + photo(c.id, "m") + '<div><div class="nm"><button class="nmb" data-act="file" data-id="' + c.id + '">' + esc(f.name) + '</button>' +
      (c.s1 ? ' <span class="tg">From Step 1</span>' : '') + '</div><div class="fl">' +
      c.flags.map(function(x){ return '<span class="tg red">' + esc(x) + '</span>'; }).join("") + '</div></div></div><div class="slot">' + slot + '</div></div>';
  }).join("");
  var h = '<div class="topline"><div><h2>Triage</h2><p class="sub" style="margin:0">Most urgent first. Click a photo to open the file.</p></div>' +
    (waiting.length ? '<button class="btn primary" data-act="assign" data-guide="assign"' + (S.reveal ? " disabled" : "") + '>Auto-assign</button>' : '') + '</div>' + rows;
  if (pend.length && !S.reveal){
    h += '<div class="admin"><div class="t"><b>Admin check</b><div class="sub" style="margin:0">Only the urgent cases need a quick look.</div></div><button class="btn primary" data-act="approve" data-guide="approve">Approve</button></div>';
  }
  if (S.asg.biscuit && !pend.length && !waiting.length){
    h += '<div class="ok"><span>All set. These cases are on the board now.</span><button class="btn primary" data-act="openboard" data-guide="board">Open the board</button></div>';
  }
  if (!S.sent) h += '<p class="sub">Biscuit from Step 1 appears here after you send him.</p>';
  return h;
}

function boardList(){
  var list = SEEDS.map(function(s){ return {id:s.id, pri:s.pri, who:s.who, seed:true}; });
  queue().forEach(function(c){ if (S.asg[c.id]) list.push({id:c.id, pri:c.pri, who:c.who}); });
  var rank = {red:0, yellow:1, green:2};
  return list.sort(function(a, b){ return (rank[a.pri] - rank[b.pri]) || ((a.seed ? 1 : 0) - (b.seed ? 1 : 0)); });
}
function cardState(id){ return S.cards[id] || (S.cards[id] = {stage:0, done:0}); }
function view3(){
  var L = boardList();
  var sel = L.filter(function(b){ return b.id === S.sel; })[0] || L[0];
  var ctl = '<div class="ctl"><button class="btn primary" data-act="ai" data-guide="ai">AI reads new emails</button><span class="sel">for <b>' + esc(FILES[sel.id].name) + '</b>. Click a card to choose another.</span></div>';
  var cols = STAGES.map(function(st, i){
    var here = L.filter(function(b){ return cardState(b.id).stage === i; });
    var cards = here.map(function(b){
      var c = cardState(b.id), ready = c.done >= 3, last = i === 4, f = FILES[b.id];
      var nxt = c.done >= 3 ? "All done here" : "Next: " + ITEMS[i][c.done];
      var sug = "";
      if (c.adopted) sug = '<div class="joy">Adopted</div>';
      else if (ready) sug = '<div class="sug"><div>' + (last ? "Ready to close as adopted?" : "Ready for " + STAGES[i + 1] + "?") + '</div><button class="btn primary sm" data-act="move" data-id="' + b.id + '"' + (b.id === "biscuit" ? ' data-guide="move"' : "") + '>' + (last ? "Approve" : "Approve move") + '</button></div>';
      return '<article class="crd' + (S.sel === b.id ? " sel" : "") + (S.entered === b.id ? " enter" : "") + '" data-act="select" data-id="' + b.id + '" tabindex="0"><div class="top">' + photo(b.id, "s", b.id === "biscuit") +
        '<div class="tx"><button class="nmb" data-act="file" data-id="' + b.id + '">' + esc(f.name) + '</button><div class="by">' + esc(b.who) + '</div></div><span class="dot" style="background:' + PCOL[b.pri] + '" title="' + PRI[b.pri] + '"></span></div>' +
        '<div class="prg"><div class="bar"><span style="width:' + Math.min(100, Math.round(c.done / 3 * 100)) + '%"></span></div><span>' + Math.min(3, c.done) + ' of 3</span></div>' +
        '<div class="nx">' + esc(nxt) + '</div>' + sug + '</article>';
    }).join("");
    return '<section class="col"><div class="ch"><span class="n">' + (i + 1) + '</span>' + st + '<span class="c">' + here.length + '</span></div><div class="cards">' + cards + '</div></section>';
  }).join("");
  var fresh = L.filter(function(b){ return !b.seed; }).length;
  var note = fresh ? "" : '<p class="sub">New cases appear in Intake after Step 2 assigns them.</p>';
  var done = curGuide() < 0 ? '<div class="fin">That is the whole loop.</div>' : '';
  return '<h2>Journey board</h2><p class="sub">One card per animal, from intake to adoption</p>' + ctl + note + '<div class="board">' + cols + '</div>' + done;
}

/* ---------- case file ---------- */
function drawerHTML(){
  var id = S.file; if (!id) return "";
  var f = FILES[id], q = QUEUE.filter(function(c){ return c.id === id; })[0], sd = SEEDS.filter(function(c){ return c.id === id; })[0];
  var pri = q ? q.pri : (sd ? sd.pri : "green");
  var onBoard = !!sd || (q && S.asg[id]);
  var who = sd ? sd : (q && S.asg[id] ? q : null);
  var cr = CREDITS[id];
  var over = f.hi > BUDGET, pct = Math.min(100, Math.round(f.hi / (BUDGET * 2) * 100));
  var h = '<div class="scrim" data-act="closefile"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="' + esc(f.name) + ' case file">';
  h += '<div class="dph">' + (PHOTOS[id] ? '<img src="' + PHOTOS[id] + '" alt="' + esc(f.name) + '">' : '') + '<button class="x" data-act="closefile" id="closeBtn" aria-label="Close">&times;</button>' +
    (cr ? '<span class="cr">Photo: ' + esc(cr.artist) + ', ' + esc(cr.license) + '</span>' : '') + '</div>';
  h += '<div class="dbody"><div class="dtitle"><div><h2>' + esc(f.name) + '</h2><div class="dmeta">' + esc(f.breed) + ', ' + esc(f.age) + ', ' + esc(f.sex) + '</div><div class="dmeta">' + esc(f.id) + '</div></div><span class="pill ' + pri + '">' + PRI[pri] + '</span></div>';
  h += '<div class="handled"><span>Handled by</span><b>' + (who ? esc(who.who) + ' <span style="font-weight:500;color:var(--ink2)">' + esc(who.role) + '</span>' : 'Not assigned yet') + '</b></div>';
  h += '<div class="dsec"><h3>Details</h3><div class="dgrid"><div><small>Situation</small><span>' + esc(f.situation) + '</span></div><div><small>Contact</small><span>' + esc(f.contact) + '</span></div>' +
    '<div><small>Vet</small><span>' + esc(f.vet) + '</span></div><div><small>Medications</small><span>' + esc(f.meds) + '</span></div>' +
    '<div><small>Bite history</small><span>' + esc(f.bite) + '</span></div><div><small>Deadline</small><span>' + esc(f.deadline) + '</span></div></div></div>';
  h += '<div class="dsec"><h3>Estimated cost</h3><div style="font-weight:600;font-size:17px">' + esc(f.cost) + '</div><div class="bm' + (over ? " over" : "") + '"><span style="width:' + pct + '%"></span><i></i></div><div class="by">' + (over ? "Over" : "Within") + ' the ' + money(BUDGET) + ' limit per case</div></div>';
  if (onBoard){
    var c = cardState(id), st = c.stage, steppers = STAGES.map(function(n, i){ return '<i class="' + (i < st ? "on" : (i === st ? "cur" : "")) + '"></i>'; }).join("");
    h += '<div class="dsec"><h3>Journey: ' + STAGES[st] + '</h3><div class="stepper">' + steppers + '</div><ul class="cl">' +
      ITEMS[st].map(function(t, k){ return '<li class="' + (k < c.done ? "d" : "") + '"><span class="b">' + (k < c.done ? "&#10003;" : "") + '</span>' + esc(t) + '</li>'; }).join("") + '</ul></div>';
  } else {
    h += '<div class="dsec"><h3>Journey</h3><div class="by">Not on the board yet. It joins after Step 2 assigns it.</div></div>';
  }
  h += '<div class="dsec"><h3>Action items</h3><ol class="dl">' + f.actions.map(function(a){ return '<li>' + esc(a[0]) + ' <span>' + esc(a[1]) + '</span></li>'; }).join("") + '</ol></div>';
  var hist = f.base.concat(S.hist[id] || []).slice(-5).reverse();
  h += '<div class="dsec"><h3>History</h3><ul class="hist">' + hist.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div></div>';
  h += '<div class="dfoot"><button class="btn" data-act="closefile">Close</button></div></aside>';
  return h;
}

function creditsHTML(){
  var items = Object.keys(CREDITS).map(function(k){ var c = CREDITS[k]; return '<li>' + esc(FILES[k].name) + ': ' + esc(c.artist) + ', ' + esc(c.license) + ', <a href="' + esc(c.url) + '" target="_blank" rel="noopener">source</a></li>'; }).join("");
  return '<summary>Photo credits</summary><ul>' + items + '</ul>';
}

function render(){
  $("#guide").innerHTML = guideHTML();
  $("#steps").innerHTML = stepsHTML();
  $("#view").innerHTML = S.view === 1 ? view1() : (S.view === 2 ? view2() : view3());
  var hadFile = !!$("#drawer").firstChild;
  $("#drawer").innerHTML = drawerHTML();
  if (S.file && !hadFile){ var cb = $("#closeBtn"); if (cb) cb.focus(); }
  var g = curGuide();
  if (g >= 0 && !S.file){
    document.querySelectorAll('[data-guide="' + GUIDE[g].target + '"]').forEach(function(el){ el.classList.add("pulse"); });
  }
  S.pop = null; S.entered = null;
}

function play(id){
  if (S.running) return;
  S.shown = null; S.running = {id:id, i:0}; render();
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function finish(){
    S.running = null; S.shown = id;
    if (!S.played[id]){
      S.played[id] = true;
      if (id === "text"){ S.caseStarted = true; addHist("biscuit", "Text from Dana arrives"); addHist("biscuit", "Fetch reads it and estimates $350 to $700"); addHist("biscuit", "Case started automatically"); }
    }
    render();
  }
  if (reduce){ finish(); return; }
  var t = setInterval(function(){ S.running.i++; if (S.running.i >= 5){ clearInterval(t); finish(); } else render(); }, 520);
}
function assign(){
  if (S.reveal) return;
  var todo = queue().filter(function(c){ return !S.asg[c.id]; }), i = 0;
  S.reveal = true; render();
  (function step(){
    if (i >= todo.length){ S.reveal = false; render(); return; }
    S.asg[todo[i].id] = true; S.pop = todo[i].id; addHist(todo[i].id, "Assigned to " + todo[i].who); i++; render();
    setTimeout(step, 380);
  })();
}

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
  if (act === "play") play(id);
  else if (act === "send"){ S.sent = true; addHist("biscuit", "Sent to triage"); render(); setTimeout(function(){ S.view = 2; render(); window.scrollTo(0, 0); }, 500); }
  else if (act === "goview"){ S.view = +b.getAttribute("data-v"); if (S.view === 3 && S.asg.biscuit) S.opened = true; render(); }
  else if (act === "assign") assign();
  else if (act === "approve"){ queue().forEach(function(c){ if (c.check && S.asg[c.id] && !S.approved[c.id]){ S.approved[c.id] = true; addHist(c.id, "Admin approved the assignment"); } }); render(); }
  else if (act === "openboard"){ S.opened = true; S.view = 3; render(); window.scrollTo(0, 0); }
  else if (act === "select"){ S.sel = id; render(); }
  else if (act === "file"){ S.file = id; S.fileSeen[id] = true; render(); }
  else if (act === "closefile"){ S.file = null; render(); }
  else if (act === "ai"){
    var c = cardState(S.sel);
    if (c.adopted) return;
    c.done = 3; addHist(S.sel, "AI read new emails and checked off " + STAGES[c.stage]); if (S.sel === "biscuit") S.bUpdated = true; render();
  }
  else if (act === "move"){
    var cs = cardState(id);
    if (cs.stage === 4){ cs.adopted = true; S.sel = id; addHist(id, "Closed as adopted"); render(); return; }
    cs.stage++; cs.done = 0; S.sel = id; S.entered = id; addHist(id, "Moved to " + STAGES[cs.stage] + ", approved by staff"); if (id === "biscuit") S.bMoved = true; render();
  }
  else if (act === "reset") init();
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && S.file){ S.file = null; render(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("crd")){ e.preventDefault(); e.target.click(); }
});
$("#credits").innerHTML = creditsHTML();
init();
</script>
</body>
</html>
